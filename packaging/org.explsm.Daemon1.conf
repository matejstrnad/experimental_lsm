<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- explsmd's D-Bus API. Only root may own the name or call
     org.explsm.Daemon1. Every user may call org.explsm.AgentManager1, which
     explsmd only accepts from processes running explsm-agent; explsmd may
     call org.explsm.Agent1 on the agents.
     Install into /etc/dbus-1/system.d/ (or /usr/share/dbus-1/system.d/). -->
<busconfig>
  <policy user="root">
    <allow own="org.explsm.Daemon1"/>
    <allow send_destination="org.explsm.Daemon1"/>
    <allow send_interface="org.explsm.Agent1"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.explsm.Daemon1"/>
    <allow send_destination="org.explsm.Daemon1"
           send_interface="org.explsm.AgentManager1"/>
  </policy>
</busconfig>
