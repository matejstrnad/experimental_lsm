[package]
name = "explsm-agent"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
explsm-ipc.workspace = true
futures-util = { version = "0.3", default-features = false }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
zbus = { workspace = true, features = ["service"] }

[features]
# `--answer`, which answers every prompt without asking, for the smoke tests.
# Never in an installed agent: any process of the user could run it and have
# its own denials allowed.
test-answer = []
