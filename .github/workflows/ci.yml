name: CI

on:
  push:
    branches: [main, release-hardening]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes a running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        # build.rs compiles explsmd/bpf/explsm.bpf.c with clang -target bpf.
        run: sudo apt-get update -q && sudo apt-get install -y -q clang llvm libc6-dev-i386
      - name: Toolchain
        run: rustup show && rustup component add rustfmt clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: check-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release

  vm-smoke:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported kernel, the one in the middle, the newest
        # stable. Ubuntu's mainline builds have BTF and CONFIG_BPF_LSM.
        kernel: [v6.9, v6.15, v7.3.3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang llvm libc6-dev-i386 qemu-system-x86 \
            busybox-static kmod zstd udev iproute2 dbus python3-pip \
            util-linux bsdextrautils linux-tools-common "linux-tools-$(uname -r)"
          # The bpftool wrapper picks a binary by `uname -r`, which is the
          # guest's kernel in the VM: put the real one first in PATH.
          bpftool=$(find /usr/lib -path '*tools*' -name bpftool -type f | head -1)
          [ -n "$bpftool" ] || { echo "no bpftool binary found"; exit 1; }
          sudo install -m755 "$bpftool" /usr/local/bin/bpftool
          bpftool version
          sudo pip install --break-system-packages virtme-ng==1.42
          vng --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: smoke-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: smoke-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/virtme-ng/${{ matrix.kernel }}
          key: kernel-${{ matrix.kernel }}
      - name: Smoke tests in a VM
        run: tests/vm-smoke.sh --kernel ${{ matrix.kernel }} --cpus 4 --memory 4G
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-logs-${{ matrix.kernel }}
          path: target/vm-smoke-logs/
          if-no-files-found: ignore
