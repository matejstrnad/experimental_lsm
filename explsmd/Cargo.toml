[package]
name = "explsmd"
edition.workspace = true
# The embedded BPF programs (bpf/) are MIT OR GPL-2.0.
license = "(MIT OR Apache-2.0) AND (MIT OR GPL-2.0)"
version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
aya.workspace = true
clap.workspace = true
explsm-common = { workspace = true, features = ["user"] }
explsm-ipc.workspace = true
explsm-policy.workspace = true
futures-util = { version = "0.3", default-features = false }
glob = "0.3"
inotify = { version = "0.11", default-features = false, features = ["stream"] }
landlock = "0.4.7"
libc.workspace = true
tokio.workspace = true
zbus = { workspace = true, features = ["service"] }

[build-dependencies]
anyhow.workspace = true
