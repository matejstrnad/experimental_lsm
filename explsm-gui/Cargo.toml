[package]
name = "explsm-gui"
description = "explsm's prompt dialog and settings window (GTK4, libadwaita)"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
explsm-ipc.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
serde_json.workspace = true
tokio.workspace = true
zbus.workspace = true

[features]
# `explsm-gui test …`, which calls explsmd's GUI methods from the command
# line, for tests/gui-smoke.sh. Never in an installed GUI: it has the agent's
# identity, so any process of the user could read their security picture.
test-cli = []
